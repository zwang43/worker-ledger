name: LedgerApp
options:
  bundleIdPrefix: cn.ledger
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    PRODUCT_NAME: "打工人小账本"
    PRODUCT_BUNDLE_IDENTIFIER: cn.ledger.workerapp
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: "YES"
targets:
  LedgerApp:
    type: application
    platform: macOS
    sources:
      - path: LedgerApp
    resources:
      - path: LedgerApp/Resources/bridge/ai_bridge.py
      - path: LedgerApp/Resources/bridge/omlx_expense_bridge.py
      - path: LedgerApp/Resources/bridge-bin/ai_bridge.bin
      - path: LedgerApp/Resources/default_model_registry.json
    info:
      path: LedgerApp/Info.plist
      properties:
        CFBundleDisplayName: "打工人小账本"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: "public.app-category.finance"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.ledger.workerapp
        PRODUCT_MODULE_NAME: LedgerApp
        GENERATE_INFOPLIST_FILE: "NO"
  LedgerAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LedgerAppTests
    dependencies:
      - target: LedgerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.ledger.workerapp.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/打工人小账本.app/Contents/MacOS/打工人小账本"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LedgerApp:
    build:
      targets:
        LedgerApp: all
        LedgerAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LedgerAppTests
