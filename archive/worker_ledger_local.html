<!DOCTYPE html>
<html data-page-node-id="J3tsJjMPxoqrN4P5yFUvRw" data-theme="light" lang="zh-CN">
<head data-page-node-id="GLQbmKcWnUhTahNSfqyck4>
<script data-page-node-id="tLPc1RYS08uOWiXT9l5i6Z" src="/page/page_comm/inject.js"></script>
  <meta data-page-node-id="uE9uk0c7NfDMCAtltjJANl" charset="utf-8">
  <meta data-page-node-id="G9o8flrk1Xi7BiaUtxAXig" content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
  <title data-page-node-id="h8ZxU2DfdLK7FU67rZvpjo" data-pnid-children="b5YUHyLD5l7BzygH3zlSzw">打工人小账本 - 本地版本</title>
  <style data-page-node-id="Hi7WIJx3nSiaF8BqLF3rm3" data-pnid-children="6ofny4PgN3hfsQMM2aeXf6">
    :root {
      color-scheme: light;
      --ink-deep: #163b3d;
      --ink: #31595a;
      --muted: #708786;
      --positive: #16856f;
      --positive-strong: #116b5b;
      --positive-pale: #dff4ea;
      --brand: #16856f;
      --brand-soft: #dff4ea;
      --danger: #d95f5f;
      --danger-pale: #ffe7e1;
      --warning: #9a6a18;
      --warning-pale: #fff2c7;
      --paper: #f8f5ed;
      --surface: #fffdf7;
      --surface-soft: #edf7f0;
      --surface-raised: #fffaf0;
      --line: #d7ded5;
      --line-strong: #b9cdc5;
      --blue: #5c88b8;
      --coral: #d95f5f;
      --coral-pale: #ffe7e1;
      --sun: #f6c95f;
      --sun-pale: #fff2c7;
      --shadow: 0 1px 0 rgba(22, 59, 61, 0.04), 0 8px 24px rgba(22, 59, 61, 0.055);
      --shadow-soft: 0 4px 14px rgba(22, 59, 61, 0.065);
      --radius: 22px;
      --control-radius: 14px;
      --sidebar: 256px;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --ink-deep: #e8f4ee;
      --ink: #c5ddd5;
      --muted: #91aaa3;
      --positive: #73d1b6;
      --positive-strong: #9be2cc;
      --positive-pale: #193f37;
      --brand: #73d1b6;
      --brand-soft: #193f37;
      --danger: #ff958d;
      --danger-pale: #4b2928;
      --warning: #f0c978;
      --warning-pale: #4a3c20;
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.025), 0 8px 24px rgba(0, 0, 0, 0.16);
      --shadow-soft: 0 4px 14px rgba(0, 0, 0, 0.15);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100dvh;
      color: var(--ink-deep);
      background:
        radial-gradient(circle at 88% 8%, var(--brand-soft), transparent 34%),
        linear-gradient(145deg, var(--paper), var(--surface-soft));
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
    .header { text-align: center; padding: 40px 0; }
    .header h1 { color: var(--brand); margin-bottom: 10px; }
    .status { 
      background: var(--positive-pale); 
      color: var(--positive-strong); 
      padding: 15px; 
      border-radius: var(--radius); 
      margin: 20px 0;
      text-align: center;
      font-weight: bold;
    }
    .form-group { margin: 20px 0; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--control-radius);
      font-size: 16px;
    }
    .btn {
      background: var(--brand);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: var(--control-radius);
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    .btn:hover { background: var(--positive-strong); }
    .btn-secondary { background: var(--muted); }
    .btn-secondary:hover { background: var(--ink); }
    .expense-list { margin: 20px 0; }
    .expense-item {
      background: var(--surface);
      padding: 15px;
      margin: 10px 0;
      border-radius: var(--control-radius);
      border: 1px solid var(--line);
    }
    .expense-item .amount { color: var(--danger); font-weight: bold; font-size: 18px; }
    .expense-item .category { background: var(--brand-soft); color: var(--brand); padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    .summary { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; 
      margin: 20px 0;
    }
    .summary-card {
      background: var(--surface-raised);
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--line);
    }
    .summary-card h3 { color: var(--muted); margin-bottom: 10px; }
    .summary-card .value { font-size: 24px; font-weight: bold; color: var(--ink-deep); }
    .hidden { display: none; }
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--control-radius);
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">🌙 切换主题</button>
  
  <div class="container">
    <div class="header">
      <h1>🏠 打工人小账本 - 本地版本</h1>
      <div class="status">
        ✅ 本地模式 - 数据存储在浏览器本地，不上传云端
      </div>
    </div>

    <div id="profile-section" class="section">
      <h2>个人设置</h2>
      <div class="form-group">
        <label>月薪 (¥):</label>
        <input type="number" id="monthly-salary" placeholder="请输入月薪">
      </div>
      <div class="form-group">
        <label>每月工作成本 (¥):</label>
        <input type="number" id="monthly-cost" placeholder="请输入每月工作成本">
      </div>
      <div class="form-group">
        <label>每天在场小时:</label>
        <input type="number" id="daily-hours" placeholder="请输入每天工作小时">
      </div>
      <div class="form-group">
        <label>单程通勤分钟:</label>
        <input type="number" id="commute-minutes" placeholder="请输入通勤时间">
      </div>
      <button class="btn" onclick="saveProfile()">保存设置</button>
    </div>

    <div id="expense-section" class="section">
      <h2>记账</h2>
      <div class="form-group">
        <label>日期:</label>
        <input type="date" id="expense-date">
      </div>
      <div class="form-group">
        <label>分类:</label>
        <select id="expense-category">
          <option value="吃饭">吃饭</option>
          <option value="交通">交通</option>
          <option value="购物">购物</option>
          <option value="娱乐">娱乐</option>
          <option value="房租">房租</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>金额 (¥):</label>
        <input type="number" step="0.01" id="expense-amount" placeholder="请输入金额">
      </div>
      <div class="form-group">
        <label>备注:</label>
        <textarea id="expense-note" placeholder="请输入备注"></textarea>
      </div>
      <button class="btn" onclick="addExpense()">添加记录</button>
      <button class="btn btn-secondary" onclick="clearExpenseForm()">清空</button>
    </div>

    <div id="summary-section" class="section">
      <h2>月度总结</h2>
      <div class="summary">
        <div class="summary-card">
          <h3>本月收入</h3>
          <div class="value" id="monthly-income">¥0</div>
        </div>
        <div class="summary-card">
          <h3>本月支出</h3>
          <div class="value" id="monthly-expense">¥0</div>
        </div>
        <div class="summary-card">
          <h3>本月结余</h3>
          <div class="value" id="monthly-balance">¥0</div>
        </div>
      </div>
    </div>

    <div id="expense-list-section" class="section">
      <h2>支出记录</h2>
      <div class="expense-list" id="expense-list">
        <!-- 支出记录将在这里显示 -->
      </div>
    </div>
  </div>

  <script>
    // 本地存储键
    const STORAGE_KEY = 'wb_worker_ledger_local_v1';
    
    // 应用状态
    let state = {
      profile: {},
      expenses: [],
      summary: {}
    };

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      loadState();
      renderAll();
      setTodayDate();
    });

    // 设置今天日期
    function setTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('expense-date').value = today;
    }

    // 加载本地状态
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          state = JSON.parse(raw);
        } else {
          // 创建示例数据
          state = {
            profile: {
              monthlySalary: 13800,
              monthlyCost: 850,
              dailyHours: 9,
              commuteMinutes: 48
            },
            expenses: [
              {
                id: 'sample-1',
                date: new Date().toISOString().split('T')[0],
                amount: 32,
                category: '吃饭',
                note: '午餐加一杯咖啡',
                createdAt: new Date().toISOString()
              }
            ]
          };
          saveState();
        }
      } catch (error) {
        console.error('加载状态失败:', error);
        state = { profile: {}, expenses: [], summary: {} };
      }
    }

    // 保存状态到本地
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
      } catch (error) {
        console.error('保存状态失败:', error);
        return false;
      }
    }

    // 保存个人设置
    function saveProfile() {
      state.profile = {
        monthlySalary: parseFloat(document.getElementById('monthly-salary').value) || 0,
        monthlyCost: parseFloat(document.getElementById('monthly-cost').value) || 0,
        dailyHours: parseFloat(document.getElementById('daily-hours').value) || 0,
        commuteMinutes: parseFloat(document.getElementById('commute-minutes').value) || 0
      };
      
      if (saveState()) {
        alert('设置已保存！');
        renderAll();
      } else {
        alert('保存失败，请检查浏览器存储权限');
      }
    }

    // 添加支出记录
    function addExpense() {
      const expense = {
        id: Date.now().toString(),
        date: document.getElementById('expense-date').value,
        amount: parseFloat(document.getElementById('expense-amount').value) || 0,
        category: document.getElementById('expense-category').value,
        note: document.getElementById('expense-note').value,
        createdAt: new Date().toISOString()
      };

      state.expenses.push(expense);
      
      if (saveState()) {
        alert('记录已添加！');
        clearExpenseForm();
        renderAll();
      } else {
        alert('保存失败，请检查浏览器存储权限');
      }
    }

    // 清空表单
    function clearExpenseForm() {
      document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('expense-amount').value = '';
      document.getElementById('expense-note').value = '';
    }

    // 渲染所有内容
    function renderAll() {
      renderProfile();
      renderExpenses();
      renderSummary();
    }

    // 渲染个人设置
    function renderProfile() {
      if (state.profile.monthlySalary) {
        document.getElementById('monthly-salary').value = state.profile.monthlySalary;
      }
      if (state.profile.monthlyCost) {
        document.getElementById('monthly-cost').value = state.profile.monthlyCost;
      }
      if (state.profile.dailyHours) {
        document.getElementById('daily-hours').value = state.profile.dailyHours;
      }
      if (state.profile.commuteMinutes) {
        document.getElementById('commute-minutes').value = state.profile.commuteMinutes;
      }
    }

    // 渲染支出记录
    function renderExpenses() {
      const expenseList = document.getElementById('expense-list');
      expenseList.innerHTML = '';

      if (state.expenses.length === 0) {
        expenseList.innerHTML = '<p>暂无支出记录</p>';
        return;
      }

      state.expenses.forEach(expense => {
        const expenseItem = document.createElement('div');
        expenseItem.className = 'expense-item';
        expenseItem.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-weight: bold;">${expense.category}</div>
              <div style="color: var(--muted); font-size: 14px;">${expense.date}</div>
              <div style="color: var(--muted); font-size: 14px;">${expense.note}</div>
            </div>
            <div style="text-align: right;">
              <div class="amount">¥${expense.amount.toFixed(2)}</div>
              <div class="category">${expense.category}</div>
            </div>
          </div>
        `;
        expenseList.appendChild(expenseItem);
      });
    }

    // 渲染月度总结
    function renderSummary() {
      const currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM
      const monthlyExpenses = state.expenses.filter(expense => 
        expense.date.startsWith(currentMonth)
      );

      const totalExpense = monthlyExpenses.reduce((sum, expense) => sum + expense.amount, 0);
      const income = state.profile.monthlySalary || 0;
      const balance = income - totalExpense;

      document.getElementById('monthly-income').textContent = `¥${income.toFixed(2)}`;
      document.getElementById('monthly-expense').textContent = `¥${totalExpense.toFixed(2)}`;
      document.getElementById('monthly-balance').textContent = `¥${balance.toFixed(2)}`;
    }

    // 切换主题
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }

    // 加载保存的主题
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
