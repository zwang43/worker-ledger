<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  
  <!-- 记账符号 -->
  <g transform="translate(128, 128)">
    <!-- 主图标 - 账本 -->
    <rect x="-60" y="-80" width="120" height="160" rx="8" fill="url(#text)" opacity="0.9"/>
    
    <!-- 装饰线条 -->
    <rect x="-40" y="-60" width="80" height="4" rx="2" fill="url(#bg)"/>
    <rect x="-40" y="-40" width="80" height="4" rx="2" fill="url(#bg)"/>
    <rect x="-40" y="-20" width="80" height="4" rx="2" fill="url(#bg)"/>
    <rect x="-40" y="0" width="80" height="4" rx="2" fill="url(#bg)"/>
    <rect x="-40" y="20" width="80" height="4" rx="2" fill="url(#bg)"/>
    <rect x="-40" y="40" width="50" height="4" rx="2" fill="url(#bg)"/>
    
    <!-- AI 符号 -->
    <circle cx="0" cy="-100" r="16" fill="url(#text)" opacity="0.9"/>
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#bg)">AI</text>
  </g>
  
  <!-- 装饰点 -->
  <circle cx="40" cy="40" r="8" fill="url(#text)" opacity="0.3"/>
  <circle cx="216" cy="40" r="8" fill="url(#text)" opacity="0.3"/>
  <circle cx="40" cy="216" r="8" fill="url(#text)" opacity="0.3"/>
  <circle cx="216" cy="216" r="8" fill="url(#text)" opacity="0.3"/>
</svg>
